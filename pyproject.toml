[project]
name = "retinex"
version = "0.0.0"
# 3.12 is the floor the recorded stack needs: numpy 2.5.3 requires >=3.12, keras 3.15.1 requires >=3.11.
requires-python = ">=3.12"
# numpy is imported directly by retinex.features; tensorflow supplies keras 3 (and pulls numpy itself).
dependencies = ["pillow", "numpy", "tensorflow>=2.16", "keras>=3", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
